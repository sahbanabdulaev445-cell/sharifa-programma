<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#032A50"><meta name="description" content="Обращение Sharifa к родителям — о терпении, поддержке семьи и любви к Корану."><title>Sharifa — обращение к родителям</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head><body><h1 class="sr-only">Sharifa — обращение к родителям</h1><main><figure id="welcome" class="poster"><a class="poster-link" href="assets/posters/01-welcome.webp" data-index="0" aria-label="Увеличить изображение 1"><img src="assets/posters/01-welcome.webp" width="1080" height="1800" alt="Ассаляму алейкум ва рахматуллахи ва баракатуху, уважаемые родители!

Мы рады видеть вас в нашей семье Sharifa. Прежде чем ознакомить вас с нашей программой, хотим сделать небольшое напоминание." fetchpriority="high"></a></figure>
<figure id="own-pace" class="poster"><a class="poster-link" href="assets/posters/02-own-pace.webp" data-index="1" aria-label="Увеличить изображение 2"><img src="assets/posters/02-own-pace.webp" width="1080" height="1800" alt="В изучении Корана нельзя спешить и ожидать больших результатов за короткий срок. Каждый ребёнок по-своему воспринимает это дело. Кто-то с интересом приступает к занятиям, кто-то боится, переживает, думает, что Коран — это настолько великое дело, что он не справится. Наша задача — постепенно, шаг за шагом, приучать ребёнка к этой прекрасной Книге, прививать ему любовь к Корану и уверенность в своих силах." loading="lazy" decoding="async"></a></figure>
<figure id="home-support" class="poster"><a class="poster-link" href="assets/posters/03-home-support.webp" data-index="2" aria-label="Увеличить изображение 3"><img src="assets/posters/03-home-support.webp" width="1080" height="1800" alt="К сожалению, многие родители хотят увидеть удивительные результаты уже через 2–3 месяца, при этом дома практически не занимаются с ребёнком и не уделяют внимания домашним заданиям, которые мы даём. Но разница между детьми, которые повторяют уроки дома вместе с родителями, и теми, кто занимается только в школе, бывает очень большой. Дети, которым уделяют внимание дома, нередко уходят далеко вперёд." loading="lazy" decoding="async"></a></figure>
<figure id="thirty-minutes" class="poster"><a class="poster-link" href="assets/posters/04-thirty-minutes.webp" data-index="3" aria-label="Увеличить изображение 4"><img src="assets/posters/04-thirty-minutes.webp" width="1080" height="1800" alt="Поэтому наша первая просьба к вам: если вы записываете ребёнка к нам, пожалуйста, уделяйте ему хотя бы 30 минут в день для повторения уроков. Эти полчаса могут существенно повлиять на результат, а за ваше участие в обучении ребёнка, иншаАллах, вас ожидает великая награда." loading="lazy" decoding="async"></a></figure>
<figure id="patience" class="poster"><a class="poster-link" href="assets/posters/05-patience.webp" data-index="4" aria-label="Увеличить изображение 5"><img src="assets/posters/05-patience.webp" width="1080" height="1800" alt="Вторая мысль, над которой мы предлагаем задуматься. Когда вы отдаёте ребёнка на борьбу или другой вид спорта, вы понимаете, что для серьёзных результатов нужны годы: два, три, четыре года тренировок, постоянная работа и терпение. Вы не ожидаете, что за 2–3 месяца ребёнок станет чемпионом и начнёт побеждать на соревнованиях." loading="lazy" decoding="async"></a></figure>
<figure id="a-question" class="poster"><a class="poster-link" href="assets/posters/06-a-question.webp" data-index="5" aria-label="Увеличить изображение 6"><img src="assets/posters/06-a-question.webp" width="1080" height="1800" alt="Почему же в изучении Корана мы иногда хотим получить большие результаты всего за несколько месяцев?" loading="lazy" decoding="async"></a></figure>
<figure id="beautiful-reading" class="poster"><a class="poster-link" href="assets/posters/07-beautiful-reading.webp" data-index="6" aria-label="Увеличить изображение 7"><img src="assets/posters/07-beautiful-reading.webp" width="1080" height="1800" alt="Ведь правильное чтение Корана — это тоже путь, который требует времени, регулярных занятий, повторения и старания. Чтобы ребёнок научился читать Коран качественно, красиво и правильно, недостаточно просто довести его до чтения. Нужно продолжать работать над произношением букв, правилами таджвида, плавностью чтения и закреплением пройденного." loading="lazy" decoding="async"></a></figure>
<figure id="step-by-step" class="poster"><a class="poster-link" href="assets/posters/08-step-by-step.webp" data-index="7" aria-label="Увеличить изображение 8"><img src="assets/posters/08-step-by-step.webp" width="1080" height="1800" alt="Мы просим вас набраться терпения, довериться нашей программе и пройти этот путь вместе с нами. Наша цель — в течение первого учебного года заложить ребёнку хорошую основу чтения Корана, а на втором году перейти к систематическому заучиванию 30-го джуза." loading="lazy" decoding="async"></a></figure>
<figure id="together" class="poster"><a class="poster-link" href="assets/posters/09-together.webp" data-index="8" aria-label="Увеличить изображение 9"><img src="assets/posters/09-together.webp" width="1080" height="1800" alt="Помните: школа и учитель не смогут добиться максимального результата без участия родителей. Только совместная работа учителя, ребёнка и семьи, иншаАллах, приведёт к хорошим результатам.

ИншаАллах, пусть Аллах сделает вашего ребёнка причиной вашего вхождения в Рай, а вас — причиной Рая для ваших родителей." loading="lazy" decoding="async"></a></figure>
<figure id="gratitude" class="poster"><a class="poster-link" href="assets/posters/10-gratitude.webp" data-index="9" aria-label="Увеличить изображение 10"><img src="assets/posters/10-gratitude.webp" width="1080" height="1800" alt="Уважаемые родители, баракаллаху фикум за то, что выбрали нас и доверили нам самое ценное — своих детей. Мы искренне ценим ваше доверие и постараемся оправдать ваши надежды. Пусть Аллах благословит наши общие старания, дарует нашим детям любовь к Корану и сделает их из числа тех, кто изучает Коран и обучает ему других." loading="lazy" decoding="async"></a></figure></main><nav class="viewer-controls" aria-label="Просмотр изображений"><button id="previous" aria-label="Предыдущее изображение" title="Предыдущее изображение"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg></button><div class="progress" role="progressbar" aria-label="Ход чтения" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1"><span style="width:10%"></span></div><button id="next" aria-label="Следующее изображение" title="Следующее изображение"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 10 6 6 6-6"/></svg></button><button id="zoom" aria-label="Увеличить изображение" title="Увеличить изображение"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5M8 10.5h5m-2.5-2.5v5"/></svg></button><button id="print" aria-label="Сохранить в PDF" title="Сохранить в PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4V9h16v8h-3M7 14h10v7H7z"/></svg></button></nav><dialog id="lightbox" aria
